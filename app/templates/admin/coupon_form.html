{% extends "admin/base_admin.html" %}
{% block title %}New Coupon{% endblock %}

{% block admin_content %}
<div class="d-flex align-items-center gap-2 mb-3">
  <a href="{{ url_for('admin.coupons') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
  <h3 class="mb-0">New Coupon</h3>
</div>

<div class="row">
  <div class="col-12 col-lg-7 col-xl-6">
    <div class="card">
      <div class="card-body">
        <form method="post">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="code">Coupon Code</label>
              <input type="text" class="form-control font-monospace text-uppercase" id="code" name="code"
                     placeholder="SUMMER20" required autofocus>
            </div>
            <div class="col-6">
              <label class="form-label" for="discount_type">Discount Type</label>
              <select class="form-select" id="discount_type" name="discount_type" required>
                <option value="percentage">Percentage (%)</option>
                <option value="fixed">Fixed Amount ($)</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label" for="discount_value">Discount Value</label>
              <input type="number" step="0.01" min="0" class="form-control"
                     id="discount_value" name="discount_value" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="min_amount">Min Order Amount</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" step="0.01" min="0" class="form-control"
                       id="min_amount" name="min_amount" value="0">
              </div>
            </div>
            <div class="col-6">
              <label class="form-label" for="expiry_date">Expiry Date</label>
              <input type="date" class="form-control" id="expiry_date" name="expiry_date">
              <div class="form-text">Leave blank for no expiry</div>
            </div>
            <div class="col-12 d-flex gap-2 mt-2">
              <button type="submit" class="btn btn-primary">Create Coupon</button>
              <a href="{{ url_for('admin.coupons') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
