{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if product else 'New' }} Product{% endblock %}

{% block admin_content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{{ url_for('admin.products') }}" class="btn btn-ghost btn-sm">
    <i class="bi bi-arrow-left"></i>
  </a>
  <div>
    <p class="section-title mb-0">Products</p>
    <h2 class="mb-0">{{ 'Edit' if product else 'New' }} Product</h2>
  </div>
</div>

<div class="card" style="max-width:600px;">
  <div class="card-body p-4">
    <form method="post">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="name">Product Name</label>
          <input type="text" class="form-control" id="name" name="name"
                 value="{{ product.name if product else '' }}" required autofocus>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label" for="category_id">Category</label>
          <select class="form-select" id="category_id" name="category_id" required>
            <option value="">Select category…</option>
            {% for cat in categories %}
              <option value="{{ cat.category_id }}"
                      {% if product and product.category_id == cat.category_id %}selected{% endif %}>
                {{ cat.name }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label" for="base_price">Base Price ($)</label>
          <input type="number" step="0.01" min="0" class="form-control"
                 id="base_price" name="base_price"
                 value="{{ "%.2f"|format(product.base_price|float) if product else '' }}" required>
        </div>
        <div class="col-12">
          <label class="form-label" for="description">Description</label>
          <textarea class="form-control" id="description" name="description" rows="4">{{ product.description if product else '' }}</textarea>
        </div>
        <div class="col-12 d-flex gap-2 mt-2">
          <button type="submit" class="btn btn-primary">
            {{ 'Update' if product else 'Create' }} Product
          </button>
          {% if product %}
            <a href="{{ url_for('admin.variants', product_id=product.product_id) }}"
               class="btn btn-outline">
              <i class="bi bi-layers me-1"></i> Manage Variants
            </a>
          {% endif %}
          <a href="{{ url_for('admin.products') }}" class="btn btn-ghost">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
