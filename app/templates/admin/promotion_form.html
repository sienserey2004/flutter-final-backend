{% extends "admin/base_admin.html" %}
{% block title %}New Promotion{% endblock %}

{% block admin_content %}
<div class="d-flex align-items-center gap-2 mb-3">
  <a href="{{ url_for('admin.promotions') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
  <h3 class="mb-0">New Promotion</h3>
</div>

<div class="row">
  <div class="col-12 col-lg-7 col-xl-6">
    <div class="card">
      <div class="card-body">
        <form method="post">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="name">Promotion Name</label>
              <input type="text" class="form-control" id="name" name="name"
                     placeholder="Summer Sale 2025" required autofocus>
            </div>
            <div class="col-12 col-sm-4">
              <label class="form-label" for="discount_percent">Discount</label>
              <div class="input-group">
                <input type="number" step="0.01" min="0" max="100" class="form-control"
                       id="discount_percent" name="discount_percent" required>
                <span class="input-group-text">%</span>
              </div>
            </div>
            <div class="col-12 col-sm-4">
              <label class="form-label" for="start_date">Start Date</label>
              <input type="date" class="form-control" id="start_date" name="start_date" required>
            </div>
            <div class="col-12 col-sm-4">
              <label class="form-label" for="end_date">End Date</label>
              <input type="date" class="form-control" id="end_date" name="end_date" required>
            </div>

            <div class="col-12">
              <label class="form-label">Apply to Products</label>
              <div class="border rounded p-2" style="max-height:260px; overflow-y:auto;">
                {% for p in products %}
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="product-{{ p.product_id }}"
                         name="product_ids" value="{{ p.product_id }}">
                  <label class="form-check-label d-flex justify-content-between" for="product-{{ p.product_id }}">
                    <span>{{ p.name }}</span>
                    <span class="text-secondary small">{{ p.category.name }}</span>
                  </label>
                </div>
                {% endfor %}
              </div>
              <div class="form-text">Select one or more products to include in this promotion.</div>
            </div>

            <div class="col-12 d-flex gap-2 mt-2">
              <button type="submit" class="btn btn-primary">Create Promotion</button>
              <a href="{{ url_for('admin.promotions') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
