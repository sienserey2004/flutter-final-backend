{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if variant else 'New' }} Variant{% endblock %}

{% block admin_content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{{ url_for('admin.variants', product_id=product.product_id) }}"
     class="btn btn-ghost btn-sm">
    <i class="bi bi-arrow-left"></i>
  </a>
  <div>
    <p class="section-title mb-0">{{ product.name }}</p>
    <h2 class="mb-0">{{ 'Edit' if variant else 'New' }} Variant</h2>
  </div>
</div>

<div class="card" style="max-width:520px;">
  <div class="card-body p-4">
    <form method="post">
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label" for="size">Size</label>
          <input type="text" class="form-control" id="size" name="size"
                 value="{{ variant.size if variant else '' }}"
                 placeholder="S, M, L, XL, 42…">
        </div>
        <div class="col-6">
          <label class="form-label" for="color">Color</label>
          <input type="text" class="form-control" id="color" name="color"
                 value="{{ variant.color if variant else '' }}"
                 placeholder="Red, #ff0000…">
        </div>
        <div class="col-6">
          <label class="form-label" for="price">Price ($)</label>
          <input type="number" step="0.01" min="0" class="form-control"
                 id="price" name="price"
                 value="{{ "%.2f"|format(variant.price|float) if variant else '' }}" required>
        </div>
        <div class="col-6">
          <label class="form-label" for="stock">Stock</label>
          <input type="number" min="0" class="form-control" id="stock" name="stock"
                 value="{{ variant.stock if variant else 0 }}" required>
        </div>
        <div class="col-12">
          <label class="form-label" for="image">Image URL</label>
          <input type="url" class="form-control" id="image" name="image"
                 value="{{ variant.image if variant else '' }}"
                 placeholder="https://…">
        </div>
        <div class="col-12 d-flex gap-2 mt-2">
          <button type="submit" class="btn btn-primary">
            {{ 'Update' if variant else 'Add' }} Variant
          </button>
          <a href="{{ url_for('admin.variants', product_id=product.product_id) }}"
             class="btn btn-ghost">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
