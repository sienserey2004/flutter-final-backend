{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if method else 'New' }} Shipping Method{% endblock %}

{% block admin_content %}
<div class="d-flex align-items-center gap-2 mb-3">
  <a href="{{ url_for('admin.shipping_methods') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
  <h3 class="mb-0">{{ 'Edit' if method else 'New' }} Method</h3>
</div>

<div class="row">
  <div class="col-12 col-lg-7 col-xl-6">
    <div class="card">
      <div class="card-body">
        <form method="post">
          <div class="row g-3">
            <div class="col-12 col-sm-8">
              <label class="form-label" for="name">Name</label>
              <input type="text" class="form-control" id="name" name="name"
                     value="{{ method.name if method else '' }}"
                     placeholder="Standard, Express, Store Pickup" required autofocus>
            </div>
            <div class="col-12 col-sm-4">
              <label class="form-label" for="sort_order">Sort order</label>
              <input type="number" class="form-control" id="sort_order" name="sort_order"
                     value="{{ method.sort_order if method else 0 }}">
            </div>
            <div class="col-12">
              <label class="form-label" for="description">Description</label>
              <input type="text" class="form-control" id="description" name="description"
                     value="{{ method.description or '' if method else '' }}"
                     placeholder="Shown to the customer at checkout">
            </div>
            <div class="col-6">
              <label class="form-label" for="fee">Fee</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" step="0.01" min="0" class="form-control" id="fee" name="fee"
                       value="{{ "%.2f"|format(method.fee|float) if method else '0.00' }}">
              </div>
            </div>
            <div class="col-6">
              <label class="form-label" for="free_over">Free over</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" step="0.01" min="0" class="form-control"
                       id="free_over" name="free_over"
                       value="{{ "%.2f"|format(method.free_over|float) if method and method.free_over is not none else '' }}"
                       placeholder="Leave blank for never">
              </div>
            </div>
            <div class="col-6">
              <label class="form-label" for="eta_days_min">ETA min (days)</label>
              <input type="number" min="0" class="form-control" id="eta_days_min" name="eta_days_min"
                     value="{{ method.eta_days_min if method else 2 }}">
            </div>
            <div class="col-6">
              <label class="form-label" for="eta_days_max">ETA max (days)</label>
              <input type="number" min="0" class="form-control" id="eta_days_max" name="eta_days_max"
                     value="{{ method.eta_days_max if method else 5 }}">
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="is_active" name="is_active" value="1"
                       {% if not method or method.is_active %}checked{% endif %}>
                <label class="form-check-label" for="is_active">Offer this at checkout</label>
              </div>
            </div>
            <div class="col-12 d-flex gap-2 mt-2">
              <button type="submit" class="btn btn-primary">{{ 'Update' if method else 'Create' }} Method</button>
              <a href="{{ url_for('admin.shipping_methods') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
