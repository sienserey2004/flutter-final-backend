{% extends "base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-box">

    <div class="text-center mb-4">
      <div class="auth-logo">🌿</div>
      <h2 style="font-weight:800;margin-bottom:.25rem;">Welcome back!</h2>
      <p style="color:var(--c-muted);margin:0;">Sign in to your {{ STORE_NAME }} account</p>
    </div>

    <div class="card" style="border-radius:var(--radius-xl);border:2px solid var(--c-border);box-shadow:var(--shadow-lg);">
      <div class="card-body p-4">
        <form method="post" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="you@example.com"
                   autocomplete="email" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="position-relative">
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="Your password"
                     autocomplete="current-password" required>
              <button type="button" onclick="togglePw()" class="btn btn-ghost btn-sm"
                      style="position:absolute;right:.5rem;top:50%;transform:translateY(-50%);border:none;">
                <i class="bi bi-eye" id="pwEye" style="color:var(--c-muted);"></i>
              </button>
            </div>
          </div>

          <div class="d-flex align-items-center justify-content-between mb-4">
            <label class="d-flex align-items-center gap-2" style="cursor:pointer;font-size:.875rem;color:var(--c-muted);">
              <input type="checkbox" name="remember" style="accent-color:var(--c-primary);width:16px;height:16px;">
              Remember me
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg" style="font-size:1rem;">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>
      </div>
    </div>

    <p class="text-center mt-4" style="font-size:.9rem;color:var(--c-muted);">
      New to {{ STORE_NAME }}?
      <a href="{{ url_for('auth.register') }}" style="color:var(--c-primary);font-weight:700;">
        Create free account →
      </a>
    </p>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePw() {
  const pw  = document.getElementById('password');
  const eye = document.getElementById('pwEye');
  if (pw.type === 'password') {
    pw.type = 'text';
    eye.className = 'bi bi-eye-slash';
  } else {
    pw.type = 'password';
    eye.className = 'bi bi-eye';
  }
}
</script>
{% endblock %}
