{% extends "base.html" %}
{% block title %}{{ code }} — {{ title }}{% endblock %}
{% block content %}
<div style="min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:3rem 2rem;text-align:center;
            background:linear-gradient(160deg,var(--c-primary-lt) 0%,var(--c-bg) 60%);">
  <div style="font-size:5rem;margin-bottom:.5rem;">🍃</div>
  <div style="font-size:5rem;font-family:var(--font-mono);font-weight:800;
              color:var(--c-primary);line-height:1;margin-bottom:.5rem;">{{ code }}</div>
  <h2 style="font-weight:800;margin-bottom:.5rem;">{{ title }}</h2>
  <p style="max-width:400px;margin:0 auto 1.5rem;">{{ message }}</p>
  <div class="d-flex gap-2 flex-wrap justify-content-center">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
      <i class="bi bi-house me-2"></i>Back to Home
    </a>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-outline-primary btn-lg">
      <i class="bi bi-bag me-2"></i>Browse Products
    </a>
  </div>
</div>
{% endblock %}
