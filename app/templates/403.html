{% extends "base.html" %}
{% block title %}403 — Access Denied{% endblock %}
{% block content %}
<div style="min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:3rem 2rem;text-align:center;
            background:linear-gradient(160deg,#fef2f2 0%,var(--c-bg) 60%);">
  <div style="font-size:5rem;margin-bottom:.5rem;">🚫</div>
  <div style="font-size:5rem;font-family:var(--font-mono);font-weight:800;
              color:var(--c-danger);line-height:1;margin-bottom:.5rem;">403</div>
  <h2 style="font-weight:800;margin-bottom:.5rem;">Access Denied</h2>
  <p style="max-width:380px;margin:0 auto 1.5rem;">
    You don't have permission to view this page. Please log in or contact support.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
    <i class="bi bi-house me-2"></i>Back to Home
  </a>
</div>
{% endblock %}
